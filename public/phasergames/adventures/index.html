    <body style="text-align: center;" onload="loadLanguagePref(); setupUserDropdown();">

        <div class="alert">
            <image src="/images/600px-Under_construction.webp" style="background-color: #110c27; padding: 10px"></image>
            <p>This game is still in the process of being reconstructed, so it is very incomplete and later updates may require resetting your save!</p>
        </div> 
        <div id="gameDiv" style="padding-top: 10px; padding-bottom: 10px;">
            <script type="text/javascript">
                // Handle constants here? May need to do a file for this, or handle it completely differently
                const AVAILABLE = [
                    "fr",
                    "en"
                ]
                loadLanguagePref(false); 
                let lang = getCurrentLanguageCode()
                if (AVAILABLE.indexOf(lang) === -1) {
                    lang = "en"
                }

                const COMMON_XML_PATH = "./data/common/";
                const ZONE_XML_PATH = `${COMMON_XML_PATH}Maps/`;
                const SHOP_XML_PATH = `${COMMON_XML_PATH}Shops/`;
                const LOCALIZED_XML_PATH = `./data/lang/${lang}/`;
                const QUEST_XML_PATH = `${LOCALIZED_XML_PATH}Quests/`;
                const TEMPLATE_XML_PATH = `${LOCALIZED_XML_PATH}Templates/`;
                const UI_XML_PATH = `${LOCALIZED_XML_PATH}UI/`;
                const ASSETS_PATH = "./assets/";
                const ROOT_ASSETS_PATH = `${ASSETS_PATH}extracted/`;
                const LEVEL_ASSETS_PATH = `${ROOT_ASSETS_PATH}Tilemaps/`;
                const TILE_ASSETS_PATH = `${ASSETS_PATH}newTiles/`;
                const SWF_ASSETS_PATH = `${ASSETS_PATH}swf/`;
                const CUTSCENE_ASSETS_PATH = `${SWF_ASSETS_PATH}cutscenes/`;
                const VOLUME = .5
                const debug = new Debug()

                /**
                 * Generates a random integer between two values
                 * @param {number} min The minimum number that could be returned
                 * @param {number} max The maximum number that could be returned
                 * @returns 
                 */
                function randomIntFromInterval(min, max) { // min and max included 
                    return Math.floor(Math.random() * (max - min + 1) + min)
                }

                function goToExternalURL(url) {
                    window.location.href = url;
                }
                
                let config = {
                    parent: "gameDiv",
                    type: Phaser.WEBGL,
                    width: 800,
                    height: 611,
                    backgroundColor: '#110c27',
                    plugins: {
                        scene: [
                        { key: "spine.SpinePlugin", plugin: spine.SpinePlugin, mapping: "spine" }
                        ]
                    },
                    physics: {
                        default: 'arcade',
                        arcade: {
                            debug: false
                        }
                    },
                    scene: [
                        Common_Load,
                        ZoneBase,
                        Common_UI
                    ],
                    mipmapFilter: "LINEAR_MIPMAP_LINEAR",
                    antialias: true,
                    pixelArt: false
                };

                const game = new Phaser.Game(config);
        
            </script>

        <script>
            setupRuffle();
            const PHASER_DIV = document.getElementById("gameDiv");
            const RUFFLE_DIV = document.getElementById("ruffleSwf");

            function onFlashFinished()
            {
                PHASER_DIV.style.display = "block";
                RUFFLE_DIV.style.display = "none";
            }

            function onFlashStarted(filePath, flashvars = '', transparentBg = true)
            {
                PHASER_DIV.style.display = "none";
                RUFFLE_DIV.style.display = "block";
                loadSWF(filePath, '611', '800', lang, flashvars, transparentBg)
            }
        </script>
